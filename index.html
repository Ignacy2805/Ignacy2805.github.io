<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ignacy</title>
    <style>
        /* Podstawowy reset i ustawienia tła */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animowany deszcz Matrixa w tle */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Główny niebieski panel centralny */
        .container {
            position: relative;
            z-index: 2;
            width: 95%;
            max-width: 950px; 
            height: 90%;
            max-height: 620px;
            background: linear-gradient(135deg, #4d66f0, #283cb3);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 35px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        /* Układ górnego paska z elementami */
        .top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        /* Nowy wiersz dla przycisku anty-hejt */
        .middle-row {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 15px 0;
        }

        /* Przyciski i zegar u góry - niebieskie */
        .btn, .clock-tile {
            flex: 1;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        /* Specjalny styl dla przycisku Akcja Anty Hejt */
        .btn-anti-hate {
            max-width: 400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        /* Efekty najechania dla niebieskich przycisków */
        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Zegar i data */
        .clock-tile {
            cursor: default;
            font-weight: 500;
        }

        #time {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        #date {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Sekcja Wielkiego Odliczania Świątecznego */
        .countdown-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Moduł świąteczny - CZERWONE WYPEŁNIENIE I CZERWONA RAMA */
        .countdown-red-box {
            width: 100%;
            background: #4a0000;
            border: 4px solid #ff1a1a;
            border-radius: 18px;
            padding: 25px 20px 30px 20px;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .countdown-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 25px;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            text-align: center;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            width: 100%;
            max-width: 600px;
        }

        /* Kafelki odliczania */
        .countdown-box {
            flex: 1;
            background: rgba(40, 0, 0, 0.7); 
            border: 1px solid rgba(255, 77, 77, 0.4);
            border-radius: 12px;
            padding: 18px 10px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .countdown-value {
            color: #ffffff;
            font-size: 2.6rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .countdown-label {
            color: rgba(255, 190, 190, 0.9);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* Instrukcja wyjścia w trybie Fullscreen */
        #exit-tip {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: monospace;
            border: 1px solid #0f0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div id="exit-tip">Naciśnij ESC, aby wyjść z trybu Matrix</div>

    <div class="container" id="main-panel">
        <div class="top-row">
            <!-- Poprawiony Przycisk GitHub -->
            <a href="https://github.com" target="_blank" class="btn">github</a>
            
            <!-- NOWY PRZYCISK POBIERZ O MNIE -->
            <a href="o-mnie.txt" download="o-mnie.txt" class="btn">pobierz o mnie</a>
            
            <!-- Przycisk Matrix -->
            <button class="btn" onclick="goFullscreen()">matrix (fullscreen)</button>
            
            <!-- Zegar i data -->
            <div class="clock-tile">
                <div id="time">00:00:00</div>
                <div id="date">01.01.2026</div>
            </div>
        </div>

        <!-- NOWY RZĄD: Przycisk akcja anty hejt -->
        <div class="middle-row">
            <a href="antyhejt.html" class="btn btn-anti-hate">akcja anty hejt</a>
        </div>
        <div class="countdown-section">
            <div class="countdown-red-box">
                <div class="countdown-title">Do Świąt Bożego Narodzenia pozostało:</div>
                <div class="countdown-container">
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-days">00</div>
                        <div class="countdown-label">Dni</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-hours">00</div>
                        <div class="countdown-label">Godzin</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-minutes">00</div>
                        <div class="countdown-label">Minut</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-seconds">00</div>
                        <div class="countdown-label">Sekund</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. OBSŁUGA ZEGARA I DATY ---
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('date').textContent = `${day}.${month}.${year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. ODLICZANIE DO ŚWIĄT BOŻEGO NARODZENIA ---
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let xmasTarget = new Date(`December 25, ${currentYear} 00:00:00`);
            
            if (now > xmasTarget) {
                xmasTarget = new Date(`December 25, ${currentYear + 1} 00:00:00`);
            }
            
            const diff = xmasTarget - now;
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- 3. EFEKT MATRIX (ZMIENIONY NA KOD BINARNY) ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const alphabet = "01";
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let rainDrops = Array(Math.floor(columns)).fill(1);

        window.addEventListener('resize', () => {
            columns = canvas.width / fontSize;
            rainDrops = Array(Math.floor(columns)).fill(1);
        });

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                
                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        // --- 4. OBSŁUGA TRYBU FULLSCREEN ---
        function goFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) {
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenToggle);
        document.addEventListener('webkitfullscreenchange', handleFullscreenToggle);

        function handleFullscreenToggle() {
            const isFull = document.fullscreenElement || document.webkitFullscreenElement;
            const panel = document.getElementById('main-panel');
            const tip = document.getElementById('exit-tip');
            
            if (isFull) {
                panel.style.opacity = '0';
                panel.style.pointerEvents = 'none';
                tip.style.opacity = '1';
                setTimeout(() => { tip.style.opacity = '0'; }, 3000);
            } else {
                panel.style.opacity = '1';
                panel.style.pointerEvents = 'auto';
                tip.style.opacity = '0';
            }
        }
    </script>
</body>
</html>
