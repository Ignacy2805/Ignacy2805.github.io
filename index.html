<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona Ignacego</title>
    <style>
        /* Podstawowy reset i ustawienia tła */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animowany deszcz Matrixa w tle */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Główny niebieski panel centralny */
        .container {
            position: relative;
            z-index: 2;
            width: 95%;
            max-width: 850px;
            height: 85%;
            max-height: 560px;
            background: linear-gradient(135deg, #4d66f0, #283cb3);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        /* Układ górnego paska z elementami */
        .top-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        /* Przyciski i zegar u góry - niebieskie */
        .btn, .clock-tile {
            flex: 1;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        /* Efekty najechania dla niebieskich przycisków */
        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Zegar i data */
        .clock-tile {
            cursor: default;
            font-weight: 500;
        }

        #time {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        #date {
            font-size: 0.8rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        /* Sekcja Wielkiego Odliczania Świątecznego */
        .countdown-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* CAŁY MODUŁ ŚWIĄTECZNY - CZERWONE WYPEŁNIENIE I CZERWONA RAMA */
        .countdown-red-box {
            width: 100%;
            background: #4a0000; /* Ciemnoczerwone pełne tło zamiast niebieskiego */
            border: 4px solid #ff1a1a; /* Gruba, jasnoczerwona rama */
            border-radius: 18px;
            padding: 20px 20px 25px 20px;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Napis przeniesiony do wnętrza ramy */
        .countdown-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            opacity: 0.95;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
            text-align: center;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* Małe kafelki odliczania - jeszcze ciemniejszy czerwony dla kontrastu */
        .countdown-box {
            background: rgba(40, 0, 0, 0.7); 
            border: 1px solid rgba(255, 77, 77, 0.4);
            border-radius: 12px;
            padding: 15px 10px;
            min-width: 100px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .countdown-value {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .countdown-label {
            color: rgba(255, 190, 190, 0.9);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }

        /* Instrukcja wyjścia w trybie Fullscreen */
        #exit-tip {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: monospace;
            border: 1px solid #0f0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>
    <div id="exit-tip">Naciśnij ESC, aby wyjść z trybu Matrix</div>

    <div class="container" id="main-panel">
        <div class="top-row">
            <a href="https://github.com" target="_blank" class="btn">github</a>
            <button class="btn" onclick="goFullscreen()">matrix (fullscreen)</button>
            <div class="clock-tile">
                <div id="time">00:00:00</div>
                <div id="date">01.01.2026</div>
            </div>
        </div>

        <div class="countdown-section">
            
            <!-- MODUŁ ŚWIĄTECZNY - TERAZ ZAWIERA NAPIS I MA CZERWONE TŁO -->
            <div class="countdown-red-box">
                <div class="countdown-title">Do Świąt Bożego Narodzenia pozostało:</div>
                <div class="countdown-container">
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-months">00</div>
                        <div class="countdown-label">Miesięcy</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-weeks">00</div>
                        <div class="countdown-label">Tygodni</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-days">00</div>
                        <div class="countdown-label">Dni</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-hours">00</div>
                        <div class="countdown-label">Godzin</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-minutes">00</div>
                        <div class="countdown-label">Minut</div>
                    </div>
                    <div class="countdown-box">
                        <div class="countdown-value" id="cd-seconds">00</div>
                        <div class="countdown-label">Sekund</div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    <script>
        // --- 1. OBSŁUGA ZEGARA I DATY ---
        function updateClock() {
            const now = new Date();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            document.getElementById('date').textContent = `${day}.${month}.${year}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 2. NOWA POPRAWIONA LOGIKA ODNLICZANIA KALENDARZOWEGO ---
        function updateChristmasCountdown() {
            const now = new Date();
            let currentYear = now.getFullYear();
            
            let target = new Date(currentYear, 11, 25, 0, 0, 0);
            if (now > target) {
                target = new Date(currentYear + 1, 11, 25, 0, 0, 0);
            }
            
            // Obliczanie różnicy w miesiącach kalendarzowych
            let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
            
            // Tworzymy datę testową przesuniętą o wyliczoną liczbę pełnych miesięcy
            let testDate = new Date(now.getTime());
            testDate.setMonth(testDate.getMonth() + months);
            
            // Jeśli przesunęliśmy się za daleko, cofamy o jeden miesiąc
            if (testDate > target) {
                months--;
                testDate = new Date(now.getTime());
                testDate.setMonth(testDate.getMonth() + months);
            }
            
            // Pozostały czas po odjęciu pełnych miesięcy kalendarzowych
            let diff = target - testDate;
            
            const msInSecond = 1000;
            const msInMinute = msInSecond * 60;
            const msInHour = msInMinute * 60;
            const msInDay = msInHour * 24;
            const msInWeek = msInDay * 7;
            
            // Wyliczanie pełnych tygodni z reszty
            const weeks = Math.floor(diff / msInWeek);
            diff %= msInWeek;
            
            // Wyliczanie pełnych dni z reszty
            const days = Math.floor(diff / msInDay);
            diff %= msInDay;
            
            // Wyliczanie godzin, minut i sekund
            const hours = Math.floor(diff / msInHour);
            diff %= msInHour;
            
            const minutes = Math.floor(diff / msInMinute);
            diff %= msInMinute;
            
            const seconds = Math.floor(diff / msInSecond);
            
            // Wstrzyknięcie poprawnych wartości do struktury strony
            document.getElementById('cd-months').textContent = String(months).padStart(2, '0');
            document.getElementById('cd-weeks').textContent = String(weeks).padStart(2, '0');
            document.getElementById('cd-days').textContent = String(days).padStart(2, '0');
            document.getElementById('cd-hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('cd-minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('cd-seconds').textContent = String(seconds).padStart(2, '0');
        }
        setInterval(updateChristmasCountdown, 1000);
        updateChristmasCountdown();

        // --- 3. OBSŁUGA PEŁNEGO EKRANU (FULLSCREEN) ---
        const panel = document.getElementById('main-panel');
        const tip = document.getElementById('exit-tip');

        function goFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        function handleFullscreenChange() {
            if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                panel.style.opacity = '0';
                panel.style.pointerEvents = 'none';
                tip.style.opacity = '1';
                setTimeout(() => { tip.style.opacity = '0'; }, 3000);
            } else {
                panel.style.opacity = '1';
                panel.style.pointerEvents = 'auto';
                tip.style.opacity = '0';
            }
        }

        // --- 4. ANIMACJA MATRIX (KOD BINARNY) ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
            rainDrops = [];
            for (let x = 0; x < columns; x++) {
                rainDrops[x] = Math.random() * -100;
            }
        }

        const alphabet = "01";
        const fontSize = 16;
        let columns = 0;
        let rainDrops = [];

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff33';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(draw, 30);
    </script>
</body>
</html>
