<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akcja Anty Hejt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Jasne, niebieskie tło */
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Biała karta na środku ekranu */
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            max-width: 640px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Twoja ankieta idealnie wtopiona w kartę */
        iframe {
            width: 100%;
            height: 380px;
            border: none;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        /* Przycisk powrotu na stronę główną */
        .back-link {
            display: inline-block;
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: color 0.2s ease;
            padding: 5px 10px;
        }

        .back-link:hover {
            color: #0284c7;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Prawidłowo osadzona Twoja ankieta Google -->
        <iframe src="https://google.com">Ładowanie formularza...</iframe>

        <!-- Link powrotu na czarną stronę główną -->
        <a href="indeks.html" class="back-link">← Powrót do strony głównej</a>
    </div>

</body>
</html>
