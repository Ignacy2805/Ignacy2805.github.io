<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akcja Anty Hejt</title>
    <style>
        /* Reset podstawowy */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Nowoczesne, jasne, niebieskie tło z delikatnym gradientem */
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Biała karta unosząca się na środku ekranu */
        .container {
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            max-width: 640px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Idealnie dopasowane okienko z ankietą Google */
        iframe {
            width: 100%;
            height: 480px;
            border: none;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        /* Przycisk powrotu na stronę główną */
        .back-link {
            display: inline-block;
            color: #64748b;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            padding: 10px 20px;
            border-radius: 10px;
            background: #f1f5f9;
        }

        .back-link:hover {
            color: #0284c7;
            background: #e2e8f0;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Twoja ankieta Google wbudowana bezpośrednio w stronę -->
        <iframe src="https://google.com">Ładowanie formularza...</iframe>

        <!-- Estetyczny przycisk powrotu na czarną stronę główną -->
        <a href="indeks.html" class="back-link">← Powrót do strony głównej</a>
    </div>

</body>
</html>
